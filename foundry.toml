[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Read-only, scoped to the contract sources. Needed by test/b20/IdentifyByAddress.t.sol,
# which enforces "a stock is identified by address, never by symbol" by scanning src/ — a
# rule about what must be ABSENT, which is the kind code review misses. Read access to one
# in-repo directory; nothing else is granted and nothing is writable.
fs_permissions = [{ access = "read", path = "./src" }]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 512

[rpc_endpoints]
base = "${BASE_RPC_URL}"

[etherscan]
base = { key = "${BASESCAN_API_KEY}", chain = 8453 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
